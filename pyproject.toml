[project]
name = "veriflow"
version = "0.4.1"
description = "A verification pipeline for evaluating models and forecasts."
authors = [
    {name = "Jurian Beunk", email = "jurian.beunk@deltares.nl"},
    {name = "Aljen Uitbeijerse", email = "aljen.uitbeijerse@vortech.nl"},
    {name = "Cees Voesenek", email = "cees.voesenek@vortech.nl"}
]
readme = "README.md"
requires-python = ">=3.11"

# https://peps.python.org/pep-0440/#compatible-release
dependencies = [
    "xarray~=2026.0",
    "scores~=2.0",
    "xskillscore~=0.0.26",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "typer~=0.24",
    "netcdf4~=1.7",
    "pyyaml~=6.0",
    "importlib-metadata>=7.0",
    "requests~=2.0",
    "zarr>=3.1.6",
    "s3fs>=2026.4.0",
]

[project.scripts]
veriflow = "veriflow.cli:app"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests"]
warn_unused_configs = true
python_version = "3.11"
plugins = ["pydantic.mypy", ]
platform = "linux" # even though the development is done on Windows
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
warn_unreachable = true
# Start with strict checking, disable when appropriate for our project
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
# Options that are not enabled yet, but may turn out to be appropriate for our project
# Move to above this commment when enabled
#explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
# zarr 3.x uses Python 3.12 type-parameter syntax in its sources, which mypy parses
# at our configured python_version = "3.11". Skip following imports into zarr to
# avoid spurious syntax errors; we only interact with zarr through xarray's API.
module = "zarr.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
# pysteps (optional 'spatial' extra) ships without type information.
module = "pysteps.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
include = ["src/**/*.py", "tests/**/*.py",] # soon add  "examples/**/*.ipynb"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
# Start of with selecting all linting checks, add specific ignores when appropriate for our project
select = ["ALL"]
# Since we are using ruff >=0.5.0, no need to explicitly ignore deprecated rules
ignore = ["CPY001"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds max-complexity
# Default level is 10, TBD whether this is appropriate for our project
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # what we do with Sauron

[tool.ruff.lint.isort]
known-first-party = ["my-project-name"]  # again, not needed with a 'flat' project layout

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401",  # imported but unused
]
"tests/**" = [
    "S101",  # use of `assert`
    "SLF001",  # Private member access
]

[tool.pytest.ini_options]
# Register custom markers. The MinIO integration tests are tagged ``minio`` so they
# can be skipped without a live S3 endpoint via ``pytest -m 'not minio'`` while still
# being discoverable in editors / test explorers.
markers = [
    "minio: integration tests that require a live S3-compatible (MinIO) endpoint",
    "pyproj: tests that require the optional pyproj dependency",
    "pysteps: tests that require the optional pysteps dependency",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "mypy>=1.20.2",
    "myst-parser>=5.0.0",
    "nbsphinx>=0.9.8",
    "pandas-stubs==3.0.5.260730",
    "pandoc>=2.4",
    "pre-commit>=4.5.1",
    "pydata-sphinx-theme>=0.16.1",
    "pytest==9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-lazy-fixtures==1.4.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.5.0",
    "sphinx>=9.0.4",
    "sphinx-design>=0.7.0",
    "sphinx-gallery>=0.20.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20260906",
]

spatial = [
    "pysteps>=1.10",
    "scikit-image",
    "pyproj",
]

[project.optional-dependencies]
tutorial = [
    "plotly",
    "matplotlib", 
    "ipykernel"
]
spatial = [
    "pysteps>=1.10",
    "scikit-image",
    "pyproj",
]
