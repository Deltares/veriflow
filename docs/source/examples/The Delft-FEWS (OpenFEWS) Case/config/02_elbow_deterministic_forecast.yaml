# yaml-language-server: $schema=https://deltares.github.io/veriflow/v0/config.schema.json
version: v0
general:
  verification_period:
    dimension: time
    start: "2026-05-15T00:00:00Z"
    end: "2026-06-01T00:00:00Z"
  verification_pairs:
    - variable: PC
      id: PC
      observations_source_id: observed
      simulations_source_id: simulated
  lead_times:
    unit: D
    values: [1, 2, 3, 4, 5, 6, 7]
datasources:
  - import_adapter: fewswebservice
    source_id: observed
    data_type: observed_historical
    location_ids:
      - "3031092"
      - "3050778"
      - "MSC-005"
      - "05BL813"
      - "05BJ804"
      - "05BL809"
      - "FIRES-B4"
      - "05BJ805"
      - "05BL812"
      - "FIRES-B5"
      - "05BJ806"
      - "05BH803"
      - "05BF825"
      - "05BH802"
      - "05BL810"
      - "05BF827"

    parameter_ids: ["PC.obs"]
    module_instance_id: ImportMeteoStations
    webservice_version: "2025.02"
  
  - import_adapter: fewswebservice
    source_id: simulated
    data_type: simulated_forecast_single
    location_ids:
      - "3031092"
      - "3050778"
      - "MSC-005"
      - "05BL813"
      - "05BJ804"
      - "05BL809"
      - "FIRES-B4"
      - "05BJ805"
      - "05BL812"
      - "FIRES-B5"
      - "05BJ806"
      - "05BH803"
      - "05BF825"
      - "05BH802"
      - "05BL810"
      - "05BF827"
    parameter_ids: ["PC.nwp"]
    module_instance_id: PreprocessGDPS
    webservice_version: "2025.02"

scores:
  - score_adapter: continuous_scores
    scores: [mean_error, mae, rmse]
    reduce_dims: []
  

id_mapping:
  variable:
    PC:
      observed: PC.obs
      simulated: PC.nwp
